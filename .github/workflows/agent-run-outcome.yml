name: Agent Run Outcome

on:
  repository_dispatch:
    types: [agent-run-outcome]

permissions:
  issues: write
  pull-requests: write

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OUTCOME: ${{ github.event.client_payload.outcome }}
      CALLBACK_PAYLOAD: ${{ github.event.client_payload.callback_payload }}
      RUN_URL: ${{ github.event.client_payload.run_url }}
      COMMENT_TARGET_TYPE: ${{ github.event.client_payload.comment_target_type }}
      COMMENT_TARGET_NUMBER: ${{ github.event.client_payload.comment_target_number }}
    steps:
      - name: Apply labels
        run: |
          ISSUE_NUMBER=$(jq -r '.issue_number' <<<"$CALLBACK_PAYLOAD")
          ALWAYS_REMOVE_LABELS=$(jq -c '.always_remove_labels' <<<"$CALLBACK_PAYLOAD")
          OUTCOME_LABELS=$(jq -c '.outcome_labels' <<<"$CALLBACK_PAYLOAD")
          FALLBACK_LABELS=$(jq -c '.fallback_labels' <<<"$CALLBACK_PAYLOAD")

          args=()

          while IFS= read -r label; do
            args+=(--remove-label "$label")
          done < <(jq -r '.[]' <<<"$ALWAYS_REMOVE_LABELS")

          plan=$(jq -c --arg outcome "$OUTCOME" '.[$outcome] // empty' <<<"$OUTCOME_LABELS")
          if [ -z "$plan" ]; then
            plan="$FALLBACK_LABELS"
          fi

          while IFS= read -r label; do
            args+=(--remove-label "$label")
          done < <(jq -r '.remove[]?' <<<"$plan")

          while IFS= read -r label; do
            args+=(--add-label "$label")
          done < <(jq -r '.add[]?' <<<"$plan")

          if [ "${#args[@]}" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" "${args[@]}"
          fi

      - name: Post outcome comment
        if: env.COMMENT_TARGET_TYPE != '' && env.COMMENT_TARGET_NUMBER != ''
        run: |
          body=$(printf '<!-- agent:run-outcome -->\n**Outcome:** %s\n[View agent-runner run](%s)' "$OUTCOME" "$RUN_URL")

          case "$COMMENT_TARGET_TYPE" in
            pr)
              gh pr comment "$COMMENT_TARGET_NUMBER" --repo "${{ github.repository }}" --body "$body"
              ;;
            issue)
              gh issue comment "$COMMENT_TARGET_NUMBER" --repo "${{ github.repository }}" --body "$body"
              ;;
            *)
              echo "Unknown comment_target_type: $COMMENT_TARGET_TYPE" >&2
              exit 1
              ;;
          esac
