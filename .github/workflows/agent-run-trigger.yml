name: Agent Run Trigger

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  trigger:
    if: contains(fromJSON('["agent:explore","agent:design","agent:implement","agent:review"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Check in-progress guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep -qx 'agent:in-progress'; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark in-progress
        if: steps.guard.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label agent:in-progress

      - name: Build task prompt
        if: steps.guard.outputs.busy == 'false'
        id: prompt
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          phase="${LABEL_NAME#agent:}"
          {
            echo "You are working on the repo ajorquera/new, not the repo you were checked out in. First: \`gh repo clone ajorquera/new\` into a fresh directory and \`cd\` into it — GH_TOKEN is already set and authorized for this. Do all of the following work from inside that clone."
            echo
            echo "Then follow the instructions in \`docs/agent-phases/${phase}.md\` exactly, for issue/PR #${ISSUE_NUMBER} in ajorquera/new."
            echo
            echo "When that's done, using \`gh issue edit ${ISSUE_NUMBER} --repo ajorquera/new\`:"
            echo
            echo "1. Always remove the label \`agent:in-progress\`."
            echo "2. Then, based on the \`AGENT_OUTCOME:\` line you just reported for the \`${phase}\` phase, change the phase label per this table (only the row matching phase \`${phase}\` and your outcome applies):"
            echo
            echo '| phase     | AGENT_OUTCOME             | label change |'
            echo '|---|---|---|'
            echo '| explore   | READY                     | remove `agent:explore`, add `agent:design` |'
            echo '| explore   | BLOCKED                   | remove `agent:explore`, add `agent:needs-human` |'
            echo '| design    | READY                     | remove `agent:design`, add `agent:implement` |'
            echo '| design    | BLOCKED                   | remove `agent:design`, add `agent:needs-human` |'
            echo '| implement | READY                     | remove `agent:implement`, add `agent:review` |'
            echo '| implement | BLOCKED                   | remove `agent:implement`, add `agent:needs-human` |'
            echo '| review    | APPROVED                  | none — leave `agent:review` as-is, the approval comment is the completion signal |'
            echo '| review    | CHANGES_REQUESTED         | remove `agent:review`, add `agent:implement` |'
            echo '| review    | CHANGES_REQUESTED_CAPPED  | remove `agent:review`, add `agent:needs-human` |'
            echo
            echo "If you have to stop before reaching a phase's \`AGENT_OUTCOME:\` line at all (crash, unrecoverable error), still remove \`agent:in-progress\` and add \`agent:needs-human\` instead of the phase label."
          } > "$RUNNER_TEMP/task_prompt.md"
          {
            echo "prompt<<PROMPT_EOF"
            cat "$RUNNER_TEMP/task_prompt.md"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch agent-runner
        if: steps.guard.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          TASK_PROMPT: ${{ steps.prompt.outputs.prompt }}
        run: |
          gh api repos/ajorquera/agent-runner/dispatches \
            --method POST \
            -f event_type=agent-run \
            -f "client_payload[prompt]=${TASK_PROMPT}"
