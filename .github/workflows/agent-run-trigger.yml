name: Agent Run Trigger

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  trigger:
    if: contains(fromJSON('["agent:explore","agent:design","agent:implement","agent:review"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Check in-progress guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep -qx 'agent:in-progress'; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark in-progress
        if: steps.guard.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label agent:in-progress

      - name: Build task prompt
        if: steps.guard.outputs.busy == 'false'
        id: prompt
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          phase="${LABEL_NAME#agent:}"
          {
            echo "You are working on the repo ajorquera/new, not the repo you were checked out in. First: \`gh repo clone ajorquera/new\` into a fresh directory and \`cd\` into it — GH_TOKEN is already set and authorized for this. Do all of the following work from inside that clone."
            echo
            echo "Then follow the instructions in \`docs/agent-phases/${phase}.md\` exactly, for issue/PR #${ISSUE_NUMBER} in ajorquera/new, ending with its \`AGENT_OUTCOME:\` trailer line. Do not edit the issue's \`agent:*\` labels yourself — the runner reads your \`AGENT_OUTCOME:\` line and does that afterward."
          } > "$RUNNER_TEMP/task_prompt.md"
          {
            echo "prompt<<PROMPT_EOF"
            cat "$RUNNER_TEMP/task_prompt.md"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch agent-runner
        if: steps.guard.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          TASK_PROMPT: ${{ steps.prompt.outputs.prompt }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          phase="${LABEL_NAME#agent:}"
          case "$phase" in
            explore)
              outcome_labels='{"READY":{"remove":["agent:explore"],"add":["agent:design"]},"BLOCKED":{"remove":["agent:explore"],"add":["agent:needs-human"]}}'
              ;;
            design)
              outcome_labels='{"READY":{"remove":["agent:design"],"add":["agent:implement"]},"BLOCKED":{"remove":["agent:design"],"add":["agent:needs-human"]}}'
              ;;
            implement)
              outcome_labels='{"READY":{"remove":["agent:implement"],"add":["agent:review"]},"BLOCKED":{"remove":["agent:implement"],"add":["agent:needs-human"]}}'
              ;;
            review)
              outcome_labels='{"APPROVED":{"remove":[],"add":[]},"CHANGES_REQUESTED":{"remove":["agent:review"],"add":["agent:implement"]},"CHANGES_REQUESTED_CAPPED":{"remove":["agent:review"],"add":["agent:needs-human"]}}'
              ;;
          esac
          gh api repos/ajorquera/agent-runner/dispatches \
            --method POST \
            -f event_type=agent-run \
            -f "client_payload[prompt]=${TASK_PROMPT}" \
            -f "client_payload[issue_repo]=ajorquera/new" \
            -f "client_payload[issue_number]=${ISSUE_NUMBER}" \
            -f 'client_payload[always_remove_labels]=["agent:in-progress"]' \
            -f "client_payload[outcome_labels]=${outcome_labels}" \
            -f 'client_payload[fallback_labels]={"remove":[],"add":["agent:needs-human"]}'
